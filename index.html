<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចុះឈ្មោះ - Learning Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Code Learning Hub</h1>
    <p>ចែករំលែកចំណេះដឹង IT និង ការសរសេរកូដ</p>
  </header>

  <main>
    <section class="register-card">
      <h2>ចុះឈ្មោះគណនីថ្មី (Register)</h2>
      
      <!-- action បញ្ជូនទិន្នន័យទៅ Backend Server -->
      <form action="/register" method="POST">
        <div class="input-group">
          <label for="email">អ៊ីមែល (Email)</label>
          <input type="email" id="email" name="email" placeholder="បញ្ចូលអ៊ីមែលរបស់អ្នក" required>
        </div>

        <div class="input-group">
          <label for="password">ពាក្យសម្ងាត់ (Password)</label>
          <input type="password" id="password" name="password" placeholder="បញ្ចូលពាក្យសម្ងាត់" required>
        </div>

        <button type="submit">ចុះឈ្មោះ (Sign Up)</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Code Learning Hub. រក្សាសិទ្ធិគ្រប់យ៉ាង។</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
